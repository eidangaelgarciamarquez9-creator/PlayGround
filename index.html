<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Asme Asphalt Nitro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09101c;font-family:Arial Black,Impact,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none;color:white;text-shadow:0 3px 8px #000}.top{position:absolute;top:16px;left:18px;font-size:clamp(18px,3vw,34px);letter-spacing:1px}.pos{color:#ffb000}.speed{position:absolute;right:22px;bottom:24px;text-align:right}.speed b{font-size:clamp(54px,9vw,94px);line-height:.82}.speed span{font-size:16px;color:#aeeaff}.nitro{position:absolute;left:20px;bottom:28px;width:min(210px,38vw);height:17px;border:2px solid rgba(255,255,255,.8);border-radius:10px;overflow:hidden;transform:skew(-12deg)}.nitro i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff8a00,#ffe500,#34e8ff);box-shadow:0 0 12px #45eaff}.controls{position:absolute;inset:auto 0 18px;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}.btn{pointer-events:auto;width:74px;height:74px;border:3px solid rgba(255,255,255,.72);border-radius:50%;background:rgba(5,18,32,.42);color:white;font-size:32px;display:flex;align-items:center;justify-content:center;user-select:none}.left,.right{font-size:30px}.rightset{display:flex;gap:10px}.nitrobtn{border-color:#4eeaff;background:rgba(0,120,180,.48);font-size:14px}.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 65%,rgba(28,65,120,.25),rgba(3,7,15,.75));pointer-events:auto;z-index:5}.start.hidden{display:none}.logo{font-size:clamp(38px,8vw,94px);font-style:italic;transform:skew(-8deg);line-height:.78;text-align:center;text-shadow:5px 5px 0 #e83b16,10px 10px 18px #000}.logo em{display:block;color:#ffc400;font-style:italic}.play{margin-top:38px;padding:15px 38px;border:0;transform:skew(-10deg);background:#ffb000;color:#111;font-size:22px;box-shadow:8px 8px 0 #d83c18}.hint{position:absolute;bottom:12px;color:#cbd9e8;font-size:12px}.count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;color:#ffd21a;text-shadow:6px 6px 0 #d42d14}.count.show{display:flex}.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}.flash.on{animation:flash .25s}@keyframes flash{50%{opacity:.7}}
@media(min-width:700px){.btn{width:78px;height:78px}.controls{bottom:24px;padding:0 25px}.nitro{bottom:35px}}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="top"><span class="pos" id="pos">1</span>/8 &nbsp; <span id="lap">1/3</span></div><div class="nitro"><i id="nitroBar"></i></div><div class="speed"><b id="speed">0</b><br><span>KM/H</span></div><div class="controls"><div class="btn left" id="left">◀</div><div class="rightset"><div class="btn nitrobtn" id="boost">NITRO</div><div class="btn right" id="right">▶</div></div></div></div>
<div class="start" id="start"><div class="logo">ASME <em>ASPHALT NITRO</em></div><button class="play" id="play">CORRER</button><div class="hint">Flechas / A-D para conducir · ESPACIO para nitro</div></div><div class="count" id="count">3</div><div class="flash" id="flash"></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}resize();addEventListener('resize',resize);
let keys={},running=false,dist=0,x=0,speed=0,nitro=100,lap=1;
const rivals=[];for(let i=0;i<7;i++)rivals.push({z:180+i*210,lane:(i%5-2)*.19,phase:i*1.7,color:['#ee3048','#15a7ed','#f3a20b','#7bdc32','#a44fe8','#eee','#ff5a19'][i]});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let tLeft=false,tRight=false,tBoost=false;function bind(id,set){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();set(true);el.setPointerCapture(e.pointerId)});const up=()=>set(false);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}bind('left',v=>tLeft=v);bind('right',v=>tRight=v);bind('boost',v=>tBoost=v);
function project(z,off){let horizon=H*.27,p=Math.max(0,1-z/1100),y=horizon+(H-horizon)*p*p,roadW=(W*.16)+(W*.76)*p*p;return{x:W/2+off*roadW,y,roadW,scale:.15+1.45*p,p}}
function drawRoad(){let horizon=H*.27;let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#4aa7c9');sky.addColorStop(1,'#dce6b5');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);ctx.fillStyle='#4a5f3d';ctx.fillRect(0,horizon,W,H-horizon);
ctx.fillStyle='#657c72';ctx.beginPath();ctx.moveTo(0,horizon);for(let i=0;i<=12;i++){let px=i*W/12,py=horizon-25-Math.sin(i*1.7)*18;i&&ctx.lineTo(px,py)}ctx.lineTo(W,horizon);ctx.closePath();ctx.fill();
for(let i=0;i<70;i++){let z=1100-i*16-(dist*.9%16);if(z<1)continue;let p=project(z,0),half=p.roadW*.5,y=p.y;if(y<horizon||y>H)continue;let stripe=Math.floor((z+dist*.9)/90)%2;ctx.fillStyle=stripe?'#30363b':'#252b2f';ctx.fillRect(p.x-half,y,half*2,12+p.p*20);ctx.fillStyle='#ececec';ctx.fillRect(p.x-half,y,half*.025,12+p.p*20);ctx.fillRect(p.x+half*.975,y,half*.025,12+p.p*20);ctx.fillStyle='#ec1d29';ctx.fillRect(p.x-half*.94,y,half*.025,12+p.p*20);ctx.fillRect(p.x+half*.915,y,half*.025,12+p.p*20);
for(let lane=-.5;lane<=.5;lane+=1){let lm=project(z,lane);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(lm.x-2*p.p,y,4*p.p,Math.max(2,10*p.p))}}
for(let z=80;z<1050;z+=100){let rel=(z-dist*.9+1100)%1100;if(rel<40)continue;let p=project(rel,0);for(let s of [-1.18,1.18]){let q=project(rel,s*.7);ctx.fillStyle='#ddd';ctx.fillRect(q.x-2*p.p,q.y-34*p.p,4*p.p,34*p.p);ctx.fillStyle='#ffb600';ctx.beginPath();ctx.arc(q.x,q.y-35*p.p,5*p.p,0,7);ctx.fill()}}}
function drawRival(r){let z=((r.z-dist*.9)%1100+1100)%1100;if(z<30||z>1050)return;let lane=r.lane+Math.sin(dist*.003+r.phase)*.05-x*.15,p=project(z,lane);drawCar(p.x,p.y,p.scale,r.color,false)}
function drawCar(cx,cy,s,color,player){ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=14;ctx.shadowOffsetY=8;ctx.fillStyle='#111';ctx.fillRect(-39,18,14,28);ctx.fillRect(25,18,14,28);ctx.fillRect(-44,-35,12,31);ctx.fillRect(32,-35,12,31);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-30,-45);ctx.lineTo(30,-45);ctx.lineTo(38,-10);ctx.lineTo(32,35);ctx.lineTo(-32,35);ctx.lineTo(-38,-10);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(-20,-38);ctx.lineTo(20,-38);ctx.lineTo(26,-10);ctx.lineTo(-26,-10);ctx.closePath();ctx.fill();ctx.fillStyle='#172737';ctx.beginPath();ctx.moveTo(-17,-33);ctx.lineTo(17,-33);ctx.lineTo(23,-12);ctx.lineTo(-23,-12);ctx.closePath();ctx.fill();ctx.fillStyle='#ff1728';ctx.fillRect(-27,28,13,7);ctx.fillRect(14,28,13,7);ctx.fillStyle='#171717';ctx.fillRect(-31,34,62,5);ctx.fillStyle='#ffd447';ctx.fillRect(-20,-42,40,4);if(player){ctx.fillStyle='rgba(255,70,0,.85)';ctx.fillRect(-16,38,8,24+Math.random()*10);ctx.fillRect(8,38,8,24+Math.random()*10)}ctx.restore()}
function update(){if(!running)return;let boosting=(tBoost||keys[' '])&&nitro>0;let forward=keys['arrowup']||keys['w'];let left=keys['arrowleft']||keys['a']||tLeft,right=keys['arrowright']||keys['d']||tRight;if(boosting){speed+=.65;nitro-=.38}else{nitro=Math.min(100,nitro+.06);speed+=forward?.55:.32}speed=Math.max(0,Math.min(boosting?270:230,speed-.13));if(left)x-=.012*(speed/100+.25);if(right)x+=.012*(speed/100+.25);x=Math.max(-1,Math.min(1,x));dist+=speed*.145;lap=1+Math.floor(dist/1800);if(lap>3)lap=3;document.getElementById('speed').textContent=Math.round(speed);document.getElementById('nitroBar').style.width=nitro+'%';document.getElementById('lap').textContent=lap+'/3';let pos=1;for(let r of rivals)if((((r.z-dist*.9)%1100+1100)%1100)<30)pos++;document.getElementById('pos').textContent=Math.min(pos,8);document.getElementById('flash').classList.toggle('on',boosting)}
function loop(){update();ctx.clearRect(0,0,W,H);drawRoad();for(let r of rivals)drawRival(r);drawCar(W/2+x*W*.24,H*.79,Math.max(.75,Math.min(1.25,W/900)), '#e83b16',true);requestAnimationFrame(loop)}loop();
function begin(){document.getElementById('start').classList.add('hidden');let c=document.getElementById('count');c.classList.add('show');let n=3;c.textContent=n;let id=setInterval(()=>{n--;if(n>0)c.textContent=n;else if(n===0)c.textContent='¡YA!';else{clearInterval(id);c.classList.remove('show');running=true}},700)}document.getElementById('play').onclick=begin;
</script></body></html>
